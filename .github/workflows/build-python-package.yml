name: build-python-package

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**.md'

  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pipenv'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade pipenv
        pipenv sync --dev
      shell: bash {0}

    - name: Setup Selenium (Linux)
      if: runner.os == 'Linux'
      run: |
        echo 'export PATH="/home/runner/work/yawast/yawast:$PATH"' >> ~/.bashrc
        echo PATH=/home/runner/work/yawast/yawast:$PATH >> .env
        export PATH="/home/runner/work/yawast/yawast:$PATH"
        echo $PATH
        which chromedriver
      shell: bash {0}

    - name: Run unit tests
      if: always()
      run: |
        pipenv run pytest --maxfail=2 --disable-warnings --tb=short --cov --cov-report=xml
      shell: bash {0}

    - name: Upload results to Codecov
      if: always()
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Build packages
      if: always()
      run: |
        pipenv run python setup.py sdist
        pipenv run python setup.py bdist_wheel
      shell: bash {0}

    - name: Run version (all)
      if: always()
      run: |
        pipenv run python ./bin/yawast-ng version
      shell: bash {0}

  build-docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4


    - name: Install pipenv (for Docker requirements build)
      run: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade pipenv
      shell: bash {0}

    - name: Update requirements for Docker build
      run: |
        if [ ! -f ./build_requirements.sh ]; then
          echo "Error: ./build_requirements.sh does not exist."
          exit 1
        fi
        if [ ! -x ./build_requirements.sh ]; then
          echo "Error: ./build_requirements.sh is not executable."
          exit 1
        fi
        ./build_requirements.sh
      shell: bash {0}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Cache Docker layers
      uses: actions/cache@v4
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build the Docker image (with cache)
      if: github.ref != 'refs/heads/main'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        tags: yawast-ci:${{ github.sha }}
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache,mode=max
